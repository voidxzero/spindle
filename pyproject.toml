[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spindle-ripper"
version = "1.8.0"
description = "All-in-one secure CD ripper for Linux: AccurateRip, MusicBrainz, cover art, many formats"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
urls = { Homepage = "https://github.com/OWNER/spindle" }
dependencies = ["PySide6>=6.4", "mutagen>=1.45", "numpy>=1.21"]
optional-dependencies = { resize = ["pillow"] }

[project.scripts]
spindle-cli = "spindle.cli:main"

[project.gui-scripts]
spindle = "spindle.gui.app:main"

[tool.setuptools.packages.find]
include = ["spindle*"]

[tool.setuptools.package-data]
"spindle.gui" = ["assets/*.svg", "assets/*.png"]
